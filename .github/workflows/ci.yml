# Pipeline de CI (GitHub Actions) dos mini projetos. Espelha o portao de qualidade
# local (ruff -> black --check -> mypy -> pytest) para que um check verde no PR
# signifique o mesmo que um clone limpo passando. Um job por projeto x versao do Python.
#
# Cada projeto de mini_projetos/ e um projeto uv independente (pyproject.toml e uv.lock
# proprios); por isso os comandos rodam dentro da pasta dele.
#
# O ruleset da main exige o check "CI concluída" (job final), por isso o gatilho de PR
# nao tem filtro de `paths`: um check exigido que nunca roda deixaria o PR travado. O push
# na main mantem o filtro, porque ali nenhum check e exigido.
#
# As Actions ficam fixadas pelo SHA do commit, com a versao no comentario: uma tag
# pode ser movida depois de publicada, o SHA nao. O Dependabot atualiza os dois juntos.
name: CI

on:
  push:
    branches: [main]
    paths:
      - "mini_projetos/**"
      - ".github/workflows/ci.yml"
  pull_request:

# Cancela runs obsoletos do mesmo ref: um push novo no PR mata o run anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade:
    name: Qualidade (${{ matrix.projeto }}, Python ${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    # Um run leva poucos minutos; o teto evita que um job travado gaste a cota.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mini_projetos/${{ matrix.projeto }}
    strategy:
      fail-fast: false
      matrix:
        projeto: [calculadora_simples, jogo_da_cobrinha, jogo_da_velha, pedra_papel_tesoura]
        # 3.12 e o piso (requires-python); 3.14 e 3.15 sao as estaveis mais novas.
        python-version: ["3.12", "3.14", "3.15"]
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nenhum passo seguinte precisa do token do GitHub; ele não fica no disco.
          persist-credentials: false

      # A chave padrao do cache hasheia todos os uv.lock e seria igual nos 4 projetos (so um
      # conseguiria salvar); o sufixo separa um cache por projeto.
      - name: Instala o uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: ${{ matrix.projeto }}

      - name: Sincroniza o ambiente (runtime + grupo dev)
        run: uv sync --frozen

      - name: Ruff (lint + ordem de imports)
        run: uv run ruff check .

      - name: Black (formatacao)
        run: uv run black --check .

      - name: Mypy (tipos)
        run: uv run mypy

      # O jogo_da_cobrinha usa o `curses` da stdlib do Linux; o windows-curses so entra
      # em sys_platform == 'win32' (pyproject.toml), sem efeito neste runner.
      - name: Pytest (suite completa)
        run: uv run pytest

  # Check unico exigido pelo ruleset: resume a matriz num nome estavel, para que trocar uma
  # versao do Python ou acrescentar um projeto nao quebre a regra. O `always()` e
  # obrigatorio: sem ele, uma falha na matriz pula este job, e job pulado conta como
  # aprovado para o ruleset.
  ci-concluida:
    name: CI concluída
    if: always()
    needs: qualidade
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Confere o resultado da matriz
        env:
          RESULTADO: ${{ needs.qualidade.result }}
        run: test "$RESULTADO" = "success"
