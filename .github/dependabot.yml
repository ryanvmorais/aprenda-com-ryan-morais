# Dependabot version updates do repositorio inteiro (consumido pelo GitHub, sem CI
# proprio): um bloco por projeto de mini_projetos/, ja que cada um tem seu proprio
# pyproject.toml e uv.lock, mais um para as Actions de .github/workflows/. Abre PRs
# de atualizacao de rotina; separado das security updates (Dependabot alerts, ligadas
# em Settings > Security do repo, que nao precisam deste arquivo).
# Agenda: domingo, 09:00 (America/Sao_Paulo). Cada ecossistema abre um unico PR
# agrupado com os bumps minor e patch; um major continua em PR proprio. As
# security updates seguem o ritmo dos alertas e ignoram esta agenda.
# Cooldown: uma versao nova espera 7 dias antes de virar PR (uma release recem-saida
# pode quebrar o projeto no dia da publicacao); as security updates ignoram o cooldown.
version: 2
updates:
  # calculadora_simples: ferramentas de dev do pyproject.toml, grafo travado no uv.lock.
  - package-ecosystem: "uv"
    directory: "/mini_projetos/calculadora_simples"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"
    cooldown:
      default-days: 7
    groups:
      uv-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # jogo_da_cobrinha: dependencia de runtime (windows-curses) e ferramentas de dev do
  # pyproject.toml, grafo travado no uv.lock.
  - package-ecosystem: "uv"
    directory: "/mini_projetos/jogo_da_cobrinha"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"
    cooldown:
      default-days: 7
    groups:
      uv-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # jogo_da_velha: ferramentas de dev do pyproject.toml, grafo travado no uv.lock.
  - package-ecosystem: "uv"
    directory: "/mini_projetos/jogo_da_velha"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"
    cooldown:
      default-days: 7
    groups:
      uv-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # pedra_papel_tesoura: ferramentas de dev do pyproject.toml, grafo travado no uv.lock.
  - package-ecosystem: "uv"
    directory: "/mini_projetos/pedra_papel_tesoura"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"
    cooldown:
      default-days: 7
    groups:
      uv-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Actions pinadas nos workflows em .github/workflows/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
