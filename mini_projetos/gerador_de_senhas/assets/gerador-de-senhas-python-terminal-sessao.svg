<defs><text id="l0">======== GERADOR DE SENHAS ========</text><text id="l1">1 : Gerar senha forte</text><text id="l2">2 : Gerar senha personalizada</text><text id="l3">3 : Gerar frase-senha</text><text id="l4">4 : Ver por que usar secrets e não random</text><text id="l5">5 : Sair</text><text id="l6">Escolha uma opção: </text><text id="l7">Escolha uma opção: 1</text><text id="l8">🔐 Senha forte:</text><text id="l9">5*75$.yx$8=;xm5M</text><text id="l10">Entropia: 16 × log2(94) ≈ 104,9 bits</text><text id="l11">Cada bit a mais dobra as tentativas de adivinhar.</text><text id="l12">Escolha uma opção: 2</text><text id="l13">Digite o tamanho, de 8 a 64 [16]: </text><text id="l14">Digite o tamanho, de 8 a 64 [16]: 7</text><text id="l15">⚠️ O tamanho vai de 8 a 64.</text><text id="l16">Digite o tamanho, de 8 a 64 [16]: 1</text><text id="l17">Digite o tamanho, de 8 a 64 [16]: 12</text><text id="l18">Minúsculas? [S/n]: </text><text id="l19">Maiúsculas? [S/n]: </text><text id="l20">Números? [S/n]: </text><text id="l21">Símbolos? [S/n]: </text><text id="l22">Símbolos? [S/n]: n</text><text id="l23">Evitar 0 O 1 l I |? [s/N]: </text><text id="l24">Evitar 0 O 1 l I |? [s/N]: s</text><text id="l25">🔐 Senha personalizada:</text><text id="l26">jfK49VRcPADS</text><text id="l27">Entropia: 12 × log2(57) ≈ 70,0 bits</text><text id="l28">Escolha uma opção: 3</text><text id="l29">Digite a quantidade de palavras, de 5 a 12 [7]: </text><text id="l30">Digite a quantidade de palavras, de 5 a 12 [7]: 5</text><text id="l31">🔐 Frase-senha:</text><text id="l32">dorsal-aferir-baseado-baixista-anuidade</text><text id="l33">Entropia: 5 × log2(2048) = 55 bits</text><text id="l34">Escolha uma opção: 4</text><text id="l35">🎲 random, duas vezes com a semente 2026:</text><text id="l36">pO#$?nC/&lt;*1,)~!.</text><text id="l37">🔐 secrets, duas vezes:</text><text id="l38">yE/d7P4.z%D&gt;L&quot;a[</text><text id="l39">k6@J0)k{GOD$Kdi+</text><text id="l40">O random segue uma conta a partir da semente:</text><text id="l41">quem descobre a semente, ou vê números seguidos</text><text id="l42">dele, prevê os próximos. O secrets usa a fonte</text><text id="l43">aleatória do sistema operacional, feita para</text><text id="l44">segurança.</text><text id="l45">Escolha uma opção: 5</text><text id="l46">Até a próxima! 👋</text></defs>
