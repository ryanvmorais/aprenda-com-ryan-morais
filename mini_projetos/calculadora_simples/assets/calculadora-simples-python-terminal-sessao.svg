<defs><text id="l0">======== CALCULADORA SIMPLIFICADA ========</text><text id="l1">1 : Soma</text><text id="l2">2 : Subtração</text><text id="l3">3 : Multiplicação</text><text id="l4">4 : Divisão</text><text id="l5">5 : Exponenciação</text><text id="l6">Escolha a operação que deseja realizar:</text><text id="l7">Digite o número (1-5): </text><text id="l8">Digite o número (1-5): 1</text><text id="l9">Operação escolhida: Soma</text><text id="l10">Digite o primeiro valor: </text><text id="l11">Digite o primeiro valor: 4</text><text id="l12">Digite o primeiro valor: 42</text><text id="l13">Digite o segundo valor: </text><text id="l14">Digite o segundo valor: 8</text><text id="l15">RESULTADO: 42.0 + 8.0 = 50.0</text><text id="l16">==========================================</text><text id="l17">Deseja realizar outra operação?</text><text id="l18">(Digite 1 para SAIR ou qualquer outra tecla para CON</text><text id="l19">TINUAR)</text><text id="l20">Sua escolha: </text><text id="l21">Sua escolha: 2</text><text id="l22">Digite o número (1-5): 5</text><text id="l23">Operação escolhida: Exponenciação</text><text id="l24">Digite o primeiro valor: 2</text><text id="l25">Digite o segundo valor: 1</text><text id="l26">Digite o segundo valor: 10</text><text id="l27">RESULTADO: 2.0 ^ 10.0 = 1024.0</text><text id="l28">Sua escolha: 1</text><text id="l29">Calculadora encerrada. Até logo! 👋</text></defs>
