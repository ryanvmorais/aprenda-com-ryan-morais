<defs><text id="l0">Escolha o nível:</text><text id="l1">  1 - Fácil   (1 a 50, 10 tentativas)</text><text id="l2">  2 - Médio   (1 a 100, 8 tentativas)</text><text id="l3">  3 - Difícil (1 a 1000, 10 tentativas)</text><text id="l4">Digite o número do nível: </text><text id="l5">Digite o número do nível: 2</text><text id="l6">Pensei num número de 1 a 100. Você tem 8 tentativas.</text><text id="l7">Tentativa 1 de 8. Seu palpite: </text><text id="l8">Tentativa 1 de 8. Seu palpite: 5</text><text id="l9">Tentativa 1 de 8. Seu palpite: 50</text><text id="l10">⬇️  O número é menor que 50. Tentativas restantes: 7.</text><text id="l11">Tentativa 2 de 8. Seu palpite: </text><text id="l12">Tentativa 2 de 8. Seu palpite: 2</text><text id="l13">Tentativa 2 de 8. Seu palpite: 25</text><text id="l14">⬆️  O número é maior que 25. Tentativas restantes: 6.</text><text id="l15">Tentativa 3 de 8. Seu palpite: </text><text id="l16">Tentativa 3 de 8. Seu palpite: a</text><text id="l17">Tentativa 3 de 8. Seu palpite: ab</text><text id="l18">Tentativa 3 de 8. Seu palpite: abc</text><text id="l19">❌ Digite um número inteiro.</text><text id="l20">Tentativa 3 de 8. Seu palpite: 3</text><text id="l21">Tentativa 3 de 8. Seu palpite: 37</text><text id="l22">🎉 Acertou na tentativa 3! O número era 37.</text><text id="l23">🏆 Novo recorde no nível médio!</text><text id="l24">Jogar de novo? (s/n): </text><text id="l25">Jogar de novo? (s/n): n</text><text id="l26">Recordes da sessão (menor número de tentativas):</text><text id="l27">  Fácil:   —</text><text id="l28">  Médio:   3</text><text id="l29">  Difícil: —</text><text id="l30">Até a próxima! 👋</text></defs>
