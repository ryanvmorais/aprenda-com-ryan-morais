<defs><text id="l0">====== VERIFICADOR DE FORÇA DE SENHA ======</text><text id="l1">1 : Verificar uma senha</text><text id="l2">2 : Ver exemplos comentados</text><text id="l3">3 : Sair</text><text id="l4">Escolha uma opção: </text><text id="l5">Escolha uma opção: 1</text><text id="l6">Digite a senha (ela não aparece na tela): </text><text id="l7">🔎 Nota: 2 de 4, razoável</text><text id="l8">Tamanho: 9 caracteres, 7 contam na entropia</text><text id="l9">Entropia estimada: 7 × log2(94) ≈ 45,9 bits</text><text id="l10">Tem: minúsculas, maiúsculas, números e símbolos</text><text id="l11">✅ Sem repetição (como aaa ou 111)</text><text id="l12">❌ Tem sequência (como abc, 123 ou qwe)</text><text id="l13">✅ Fora da lista de senhas comuns</text><text id="l14">💡 O que melhorar:</text><text id="l15">- Tire a sequência: ela quase não soma força.</text><text id="l16">- Com mais 6 caracteres, a senha passa de 80 bits.</text><text id="l17">  Uma frase-senha é longa e fácil de decorar.</text><text id="l18">🔎 Nota: 4 de 4, forte</text><text id="l19">Tamanho: 28 caracteres, 28 contam na entropia</text><text id="l20">Entropia estimada: 28 × log2(58) ≈ 164,0 bits</text><text id="l21">Tem: minúsculas e símbolos</text><text id="l22">Falta: maiúsculas e números</text><text id="l23">✅ Sem sequência (como abc, 123 ou qwe)</text><text id="l24">- Nada, pelas regras deste programa.</text><text id="l25">Escolha uma opção: 2</text><text id="l26">🔑 123mudar: 0 de 4, muito fraca</text><text id="l27">   Está na lista das senhas mais usadas.</text><text id="l28">🔑 Gato@7: 1 de 4, fraca</text><text id="l29">   Tem os quatro tipos, mas só 6 caracteres.</text><text id="l30">🔑 Senha@123: 2 de 4, razoável</text><text id="l31">   Os quatro tipos, mas o 123 é uma sequência.</text><text id="l32">🔑 girassol-azul: 3 de 4, boa</text><text id="l33">   Só minúsculas e o hífen: o tamanho faz a força.</text><text id="l34">🔑 sotaque-haver-abreviar-briga: 4 de 4, forte</text><text id="l35">   Quatro palavras sorteadas: longa e fácil.</text><text id="l36">A nota é uma estimativa por regras. Uma palavra</text><text id="l37">conhecida com um número e um símbolo no fim</text><text id="l38">continua fácil de adivinhar, mesmo com os quatro</text><text id="l39">tipos de caractere.</text><text id="l40">Escolha uma opção: 3</text><text id="l41">Até a próxima! 👋</text></defs>
